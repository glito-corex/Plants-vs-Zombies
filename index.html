<style>
  html, body { height:100%; }
  body { text-align:center; font-family:"Trebuchet MS",Verdana,sans-serif; background:#1a2b12; color:#fff; margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  #pvzWrap { position:relative; width:min(98vw, calc((100vh - 70px) * 800 / 600)); width:min(98vw, calc((100dvh - 70px) * 800 / 600)); margin:8px auto; user-select:none; -webkit-user-select:none; }
  #pvzStage { position:relative; width:100%; aspect-ratio:800/600; }
  #pvzCanvas { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:8px; box-shadow:0 6px 30px #000; background:#222; }
  #pvzCanvas:focus { outline:none; }
  #hint { margin:6px auto 20px; font-size:13px; opacity:.85; max-width:800px; }
  html:fullscreen { background:#000; }
  html:fullscreen body { justify-content:center; background:#000; min-height:100vh; min-height:100dvh; }
  html:fullscreen #pvzWrap { width:min(100vw, calc(100vh * 800 / 600)); width:min(100vw, calc(100dvh * 800 / 600)); margin:0; }
  html:fullscreen #pvzStage { border-radius:0; }
  html:fullscreen #pvzCanvas { border-radius:0; box-shadow:none; }
  html:fullscreen #hint { display:none; }
  .menubuttonapp { position: absolute !important; top: 5px !important; right: 5px !important; display: flex; gap: 10px !important; flex-direction: column !important; }
  .menubuttonapp #muteBtn { background: transparent !important; cursor: pointer !important; border: none !important;}
  .menubuttonapp #actuliser { background: transparent !important; cursor: pointer !important; border: none !important;}
</style>
<div id="pvzWrap">
  <div id="pvzStage"><canvas id="pvzCanvas" width="800" height="600" tabindex="0"></canvas></div>
</div>
<div class="menubuttonapp">
  <button id="muteBtn" title="Son"></button>
  <button id="actuliser">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
  </button>
</divdiv>
<script>
  const ICON_ON = `
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M19 5a10 10 0 0 1 0 14"/>
    </svg>
  `;

  const ICON_MUTE = `    
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
      <line x1="22" y1="9" x2="16" y2="15" stroke="#FF0000"/>
      <line x1="16" y1="9" x2="22" y2="15" stroke="#FF0000"/>
    </svg>
  `;

  const mutesound = document.getElementById('muteBtn');
  const actuliser = document.getElementById('actuliser');
  const render = (muted) => { mutesound.innerHTML = muted ? ICON_MUTE : ICON_ON; };

  window.audioAPI.isMuted().then(render);
  
  if (mutesound) {
    mutesound.addEventListener('click', async () => render(await window.audioAPI.toggleMute()));
  }
  
  if (actuliser) {
    actuliser.addEventListener('click', function () {
      location.reload();
    });
  }
</script>
<script type="module" src="src/main.js"></script>
